name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'
  AZURE_WEBAPP_NAME: reconciliation-dashboard-api
  AZURE_STATIC_APP_NAME: reconciliation-dashboard-client

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build API
        run: dotnet build src/ReconciliationDashboard.Api --no-restore -c Release

      - name: Run tests
        run: dotnet run --project tests/ReconciliationDashboard.Tests -c Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Angular deps
        run: npm ci
        working-directory: client

      - name: Build Angular
        run: npx ng build --configuration production
        working-directory: client

      - name: Upload API artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: |
            src/ReconciliationDashboard.Api/bin/Release/net10.0/publish/
          retention-days: 1

      - name: Publish API for deploy
        if: github.ref == 'refs/heads/master'
        run: dotnet publish src/ReconciliationDashboard.Api -c Release -o ./api-publish

      - name: Upload Angular artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: client/dist/client/browser/
          retention-days: 1

  deploy-api:
    name: Deploy API to Azure App Service
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./api-publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./api-publish

  deploy-frontend:
    name: Deploy Angular to Azure Static Web Apps
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: client

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: client
          output_location: dist/client/browser
          app_build_command: npx ng build --configuration production
